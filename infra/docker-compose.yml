version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-documents}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  upload:
    build:
      context: ..
      dockerfile: services/upload/Dockerfile
    env_file:
      - .env.example
    depends_on:
      - rabbitmq
      - minio
    ports:
      - "8001:8000"

  search:
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    env_file:
      - .env.example
    depends_on:
      - postgres
    ports:
      - "8002:8000"

  ocr:
    build:
      context: ..
      dockerfile: services/ocr/Dockerfile
    env_file:
      - .env.example
    depends_on:
      - rabbitmq

  extract:
    build:
      context: ..
      dockerfile: services/extract/Dockerfile
    env_file:
      - .env.example
    depends_on:
      - rabbitmq

volumes:
  pgdata:
  minio-data:
